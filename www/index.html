<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Word Pop: Definition</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Word Pop Def">
<meta name="theme-color" content="#1b1446">
<style>
  :root { --bg1:#1b1446; --bg2:#3a1f6e; --ink:#fff; --soft:rgba(255,255,255,.7); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html,body { margin:0; height:100%; overflow:hidden; font-family:ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color:var(--ink);
    background:radial-gradient(circle at 30% 20%, var(--bg2), var(--bg1) 70%); touch-action:manipulation; }
  #app { position:fixed; inset:0; display:flex; flex-direction:column;
    padding:calc(max(env(safe-area-inset-top), var(--safe-area-inset-top, 0px)) + 10px) 12px calc(max(env(safe-area-inset-bottom), var(--safe-area-inset-bottom, 0px)) + 10px); }
  header { display:flex; align-items:center; justify-content:space-between; gap:6px; z-index:5; }
  .pill { background:rgba(255,255,255,.12); border-radius:999px; padding:6px 12px; font-weight:800; font-size:17px; white-space:nowrap; }
  button.icon { background:rgba(255,255,255,.14); border:0; color:#fff; border-radius:999px; width:44px; height:44px; font-size:22px; cursor:pointer; flex:none; }
  #target { z-index:5; text-align:center; margin-top:10px; }
  #ask { color:var(--soft); font-size:16px; font-weight:600; }
  #word { font-weight:800; line-height:1.1; letter-spacing:1px; text-shadow:0 4px 14px rgba(0,0,0,.35); white-space:nowrap; }
  #field { position:relative; flex:1; overflow:hidden; margin-top:6px; }
  .bubble { position:absolute; border-radius:50%; display:flex; align-items:center; justify-content:center; text-align:center;
    font-weight:800; line-height:1.08; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.55); cursor:pointer; will-change:transform;
    padding:0 8px;
    box-shadow: inset -8px -10px 18px rgba(0,0,0,.18), inset 8px 10px 18px rgba(255,255,255,.4), 0 6px 18px rgba(0,0,0,.25);
    transition: background-color 1.2s linear, opacity .3s; }
  .bubble::after { content:''; position:absolute; top:9%; left:18%; width:22%; height:13%; border-radius:50%; background:rgba(255,255,255,.6); transform:rotate(-30deg); pointer-events:none; }
  .bubble.out { opacity:.38; }
  .bubble.wobble { animation:wobble .4s; }
  @keyframes wobble { 25%{ filter:brightness(.8);} 50%{ filter:brightness(1.2);} }
  .spark { position:absolute; width:10px; height:10px; border-radius:50%; pointer-events:none; }
  #overlay { position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center; background:rgba(15,10,40,.75); backdrop-filter:blur(4px); overflow:auto; }
  #overlay.hide { display:none; }
  .card { background:linear-gradient(160deg,#5b3bd1,#2f1d7a); border-radius:28px; padding:24px 22px; width:min(92vw,380px); text-align:center; box-shadow:0 20px 50px rgba(0,0,0,.4); margin:auto; }
  .card h1 { margin:0; font-size:40px; line-height:1; }
  #logo span { transition:color 1.2s linear; text-shadow:0 3px 0 rgba(0,0,0,.28); }
  #logo { font-size:50px; letter-spacing:1px; }
  .card h1 small { display:block; font-size:20px; opacity:.85; margin-top:4px; }
  .card p { color:var(--soft); margin:8px 0 14px; font-size:17px; }
  .big { display:block; width:100%; border:0; border-radius:18px; padding:11px; margin:9px 0; font:inherit; font-size:21px; font-weight:800; color:#2a1a5e; cursor:pointer; line-height:1.15; }
  .big small { display:block; font-size:14px; font-weight:600; opacity:.75; }
  .opt { display:flex; justify-content:space-between; align-items:center; margin:10px 2px; font-size:17px; text-align:left; }
  .toggle { width:56px; height:32px; border-radius:999px; background:rgba(255,255,255,.25); position:relative; border:0; cursor:pointer; flex:none; }
  .toggle::after { content:''; position:absolute; top:4px; left:4px; width:24px; height:24px; border-radius:50%; background:#fff; transition:left .2s; }
  .toggle.on { background:#4ade80; } .toggle.on::after { left:28px; }
  #cheer { position:fixed; left:16px; right:16px; top:36%; text-align:center; z-index:10; pointer-events:none; opacity:0; transform:scale(.5); transition:all .35s cubic-bezier(.2,1.6,.4,1); text-shadow:0 4px 20px rgba(0,0,0,.5); }
  #cheer.show { opacity:1; transform:scale(1); }
  #cheer .w { font-size:38px; font-weight:800; line-height:1.1; overflow-wrap:anywhere; }
  #cheer.miss .w { color:#ff8f8f; }
  #board { display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin-top:8px; z-index:5; }
  .chip { --c:#fff; background:rgba(255,255,255,.1); border-radius:14px; padding:3px 10px; font-weight:800; font-size:15px; border:2px solid transparent;
    display:flex; gap:6px; align-items:center; white-space:nowrap; }
  .chip.on { border-color:var(--c); background:rgba(255,255,255,.22); }
  .chip.dead { opacity:.4; text-decoration:line-through; }
  .chip i { width:10px; height:10px; border-radius:50%; background:var(--c); }
  .chip b { font-size:18px; }
  .ss { display:flex; gap:3px; } .s { width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,.3); } .s.x { background:#ff5d5d; }
  #turn { position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; text-align:center; z-index:6; cursor:pointer; }
  #turn.show { display:flex; }
  #turn .who { font-size:46px; font-weight:800; line-height:1.05; text-shadow:0 4px 14px rgba(0,0,0,.35); }
  #turn .sub { font-size:20px; color:var(--soft); margin-top:6px; }
  #turn .go { margin-top:18px; background:#fff; color:#2a1a5e; border-radius:999px; padding:10px 26px; font-size:22px; font-weight:800; }
  .seg { display:flex; gap:6px; margin:8px 0; }
  .seg button { flex:1; border:0; border-radius:12px; padding:8px 4px; font:inherit; font-size:17px; font-weight:800; color:#fff; background:rgba(255,255,255,.14); cursor:pointer; }
  .seg button.on { background:#fff; color:#2a1a5e; }
  .seg[hidden] { display:none; }
  #end { position:fixed; inset:0; z-index:25; display:none; align-items:center; justify-content:center; background:rgba(15,10,40,.8); backdrop-filter:blur(4px); overflow:auto; }
  #end.show { display:flex; }
  #endList { text-align:left; margin:10px 0 14px; font-size:18px; }
  #endList div { display:flex; justify-content:space-between; gap:10px; padding:6px 10px; border-radius:12px; background:rgba(255,255,255,.1); margin:6px 0; }
  @media (min-width:700px) and (min-height:640px) {
    .card { zoom:1.45; }
    header, #board { zoom:1.35; }
    #ask { font-size:22px; }
    #turn, #cheer { zoom:1.45; }
  }
  #cheer .d { font-size:24px; font-weight:600; margin-top:6px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="icon" id="menuBtn" aria-label="Menu">☰</button>
    <div class="pill" id="levelPill">Easy</div>
    <button class="icon" id="sayBtn" aria-label="Say the word">🔊</button>
  </header>
  <div id="board"></div>
  <div id="target">
    <div id="ask">What does this word mean?</div>
    <div id="word">&nbsp;</div>
  </div>
  <div id="field">
    <div id="turn"><div class="who"></div><div class="sub"></div><div class="go">Tap to start</div></div>
  </div>
</div>
<div id="cheer"><div class="w"></div><div class="d"></div></div>

<div id="overlay">
  <div class="card">
    <h1 id="logo" aria-label="Word Pop: Definition"></h1>
    <div class="seg" id="modeSeg">
      <button data-mode="solo" class="on">Solo</button><button data-mode="battle">Battle</button><button data-mode="teams">Teams</button>
    </div>
    <div class="seg" id="nSeg" hidden>
      <button data-n="2" class="on">2 players</button><button data-n="3">3 players</button><button data-n="4">4 players</button>
    </div>
    <p id="modeNote"></p>
    <button class="big" style="background:#a7f3d0" data-lvl="0">Easy<small>everyday words</small></button>
    <button class="big" style="background:#fde68a" data-lvl="1">Medium<small>college-level words</small></button>
    <button class="big" style="background:#fbcfe8" data-lvl="2">Hard<small>words that win arguments</small></button>
    <button class="big" style="background:#fca5a5" data-lvl="3">Extreme<small>words almost nobody knows</small></button>
    <div class="opt"><span>Sounds and read-aloud</span><button class="toggle on" id="tSound"></button></div>
    <div class="opt"><span>Calm mode (slow bubbles)</span><button class="toggle" id="tCalm"></button></div>
    <a href="privacy.html" style="display:inline-block;margin-top:8px;color:rgba(255,255,255,.7);font-size:14px">Privacy policy</a>
  </div>
</div>

<div id="end">
  <div class="card">
    <h1 id="endTitle" style="font-size:34px"></h1>
    <p id="endText"></p>
    <div id="endList"></div>
    <button class="big" id="againBtn" style="background:#a7f3d0">Start over</button>
    <button class="big" id="endMenuBtn" style="background:#c7d2fe;font-size:18px">Menu</button>
  </div>
</div>

const WORDS = DATA.map(l => ["a","n","v"].flatMap(p => l[p].map(([w,d]) => [w,d,p])));
// small words that don't count when checking whether two definitions overlap
const STOP = new Set("very extremely with without from that into over something someone others having being able easily full lacking great more than much about deeply highly quickly what when used made make done".split(" "));
const stems = d => d.toLowerCase().split(/[^a-z]+/).filter(t => t.length>=4 && !STOP.has(t)).map(t => t.slice(0,4));
const LEVELS = ["Easy","Medium","Hard","Extreme"];
const CHOICES = [3,4,4,5];   // how many definitions float per word
const COLORS = ["#e8558a","#e8853a","#c99a12","#3fae58","#3d94e0","#8762f0","#d9609a","#22b08c","#e86a6a","#4f9ed6"];

let lvl = 0, word = "", def = "", pool = [], ruled = new Set(), solved = true;
let bubbles = [], running = false, last = 0, spawnT = 0, decks = {};
let mode = "solo", nPlayers = 2, sides = [], turn = 0, game = 0, best = 0;
let opt = { sound:true, calm:false };
const TARGET = 10, MAXMISS = 3;   // first to 10 wins a battle; 3 misses and you're out
const PCOL = ["#ff6b9d","#4dabf7","#69db7c","#ffa94d"];
const NOTES = {
  solo: "Pop the bubble with the right meaning. 3 wrong answers and it's game over.",
  battle: "Pass the phone and take turns. A miss ends your turn. 3 misses and you're out. First to 10 wins.",
  teams: "2 vs 2, taking turns. Each team shares 3 misses. First team to 10 wins."
};
const $ = id => document.getElementById(id);
const field = $("field");
const shuffle = a => { for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

/* ---------- sound ---------- */
let ac;
function audio(){ if(!ac){ try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(ac && ac.state==="suspended") ac.resume(); return ac; }
function tone(freq, dur=.12, type="sine", vol=.25, slide=0){
  if(!opt.sound) return; const a = audio(); if(!a) return;
  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if(slide) o.frequency.exponentialRampToValueAtTime(freq*slide, t+dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur);
}
const popSound = () => tone(620, .15, "sine", .3, 1.8);
const softBoop = () => tone(220, .12, "triangle", .12, .8);
const winSound = () => [523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.25,"triangle",.25),i*110));

/* ---------- speech: iPhone Safari, Android Chrome, and the Android app (Capacitor TextToSpeech) ---------- */
const Speech = (() => {
  const cap = window.Capacitor;
  let nativeTTS = null;
  try {
    if (cap && cap.isNativePlatform && cap.isNativePlatform() && cap.registerPlugin) nativeTTS = cap.registerPlugin("TextToSpeech");
  } catch(e) {}
  const web = !nativeTTS && "speechSynthesis" in window ? window.speechSynthesis : null;

  let voice = null;
  function pickVoice(){
    if(!web) return;
    const vs = web.getVoices() || [];
    voice = vs.find(v=>/^en[-_]US$/i.test(v.lang) && v.localService) || vs.find(v=>/^en[-_]US$/i.test(v.lang))
         || vs.find(v=>/^en/i.test(v.lang)) || null;
  }
  if(web){ pickVoice(); try{ web.addEventListener ? web.addEventListener("voiceschanged", pickVoice) : (web.onvoiceschanged = pickVoice); }catch(e){} }

  let queue = [], busy = false, gen = 0;
  const keep = [];

  function sayOnce(text, o){
    if(nativeTTS){
      return nativeTTS.speak({ text, lang:"en-US", rate:o.rate, pitch:o.pitch, volume:1.0, category:"playback" }).catch(()=>{});
    }
    if(!web) return Promise.resolve();
    return new Promise(res => {
      let done = false; const fin = () => { if(!done){ done = true; clearTimeout(t); const i = keep.indexOf(u); if(i>=0) keep.splice(i,1); res(); } };
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US"; if(voice) u.voice = voice;
      u.rate = o.rate; u.pitch = o.pitch; u.volume = 1;
      u.onend = fin; u.onerror = fin; keep.push(u);
      const t = setTimeout(fin, 900 + text.length * 260 / o.rate);
      if(web.paused) web.resume();
      web.speak(u);
    });
  }
  function pump(){
    if(busy || !queue.length) return;
    busy = true;
    const my = gen, item = queue.shift();
    sayOnce(item.text, item).then(() => { if(my === gen){ busy = false; pump(); } });
  }
  function stop(){
    gen++; queue = []; busy = false;
    try{ if(nativeTTS) nativeTTS.stop().catch(()=>{}); else if(web) web.cancel(); }catch(e){}
  }
  return {
    say(text, {rate=.9, pitch=1, interrupt=true}={}){
      if(!opt.sound) return;
      const wasBusy = busy;
      if(interrupt) stop();
      queue.push({text, rate, pitch});
      if(interrupt && wasBusy && web) setTimeout(pump, 80); else pump();
    },
    unlock(){
      try{
        if(web && !this._u){ this._u = true; const u = new SpeechSynthesisUtterance(" "); u.volume = 0; web.speak(u); }
        if(web) pickVoice();
      }catch(e){}
    },
    stop
  };
})();
const sayWord = () => Speech.say(word.toLowerCase(), {rate:.8});
function buzz(ms){ try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} }

/* ---------- round ---------- */
function fitWord(){
  const W = $("target").clientWidth || 320;
  $("word").style.fontSize = Math.max(20, Math.min(W >= 700 ? 76 : 46, (W-16) / (word.length * .68))) + "px";
}
function newWord(){
  const list = WORDS[lvl];
  // each level keeps its own shuffled deck, so no word repeats until all 300 have come up
  let deck = decks[lvl];
  if(!deck || !deck.length){ deck = decks[lvl] = shuffle(list.slice()); if(deck[deck.length-1][0]===word) deck.reverse(); }
  let pos; [word, def, pos] = deck.pop();
  // Wrong answers that can't be ruled out at a glance:
  //  - same part of speech as the right answer (so "to ..." or "a ..." never gives it away)
  //  - no shared key word with the right answer (so two near-synonyms never show together)
  //  - about the same length as the right answer
  const mine = new Set(stems(def));
  const fits = shuffle(list.filter(w => w[0]!==word && w[2]===pos && !stems(w[1]).some(t => mine.has(t))));
  const decoys = fits.slice(0, 14).sort((x,y) => Math.abs(x[1].length-def.length) - Math.abs(y[1].length-def.length))
                     .slice(0, CHOICES[lvl]-1).map(w => w[1]);
  pool = shuffle([def, ...decoys]);
  ruled = new Set(); solved = false;
  $("turn").classList.remove("show");
  $("ask").textContent = mode==="solo" ? "What does this word mean?" : who() + ": what does this word mean?";
  $("word").textContent = word; fitWord();
  $("levelPill").textContent = LEVELS[lvl];
  clearField();
  const n = lanes().n;
  for(let i=0;i<Math.min(n, pool.length);i++) spawn(true);
  spawnT = 1.2;
  setTimeout(sayWord, 300);
}

function lanes(){
  const W = field.clientWidth, H = field.clientHeight;
  const tablet = W >= 700 && H >= 560;
  const size = tablet ? Math.max(150, Math.min(230, W/4 - 6, H/3.6)) : Math.max(108, Math.min(150, W/3 - 4));
  const n = Math.max(2, Math.floor(W/size));
  return { W, size, n, laneW: W/n };
}

function spawn(initial){
  const { size, n, laneW } = lanes(), H = field.clientHeight;
  const free = pool.filter(d => !bubbles.some(b=>b.d===d));
  if(!free.length) return false;
  // a lane is open when nothing in it is still near the bottom (or, at round start, when it's empty)
  const open = [];
  for(let i=0;i<n;i++){
    const inLane = bubbles.filter(b=>b.lane===i);
    if(initial ? !inLane.length : !inLane.some(b=>b.y > H - size - 16)) open.push(i);
  }
  if(!open.length) return false;
  const lane = open[Math.floor(Math.random()*open.length)];
  let d = free[Math.floor(Math.random()*free.length)];
  if(free.includes(def) && !initial && Math.random()<.5) d = def;   // the right answer comes back around quickly

  const el = document.createElement("div"); el.className = "bubble";
  el.style.width = el.style.height = size+"px"; el.style.fontSize = Math.max(13, size*.125)+"px";
  el.textContent = d;
  if(ruled.has(d)) el.classList.add("out");
  const ci = Math.floor(Math.random()*COLORS.length);
  el.style.backgroundColor = COLORS[ci];
  const slack = Math.max(0, (laneW-size)/2);
  const b = { el, d, size, ci, lane,
    bx: lane*laneW + slack,
    x: 0, y: initial ? H*0.25 + Math.random()*Math.max(10, H*0.75 - size) : H + 10,
    vy: (opt.calm ? 13 : 22) + Math.random()*(opt.calm?5:9) + lvl*2,
    ph: Math.random()*6.28, sway: slack, colorT: Math.random()*1.5 };
  el.addEventListener("pointerdown", e=>{ e.preventDefault(); tap(b); });
  field.appendChild(el); bubbles.push(b);
  return true;
}

function tap(b){
  audio();
  if(solved) return;
  const s = sides[turn];
  if(b.d === def){
    solved = true;
    popSound(); buzz(15); popAt(b);
    s.score++; renderBoard();
    reveal(true);
  } else {
    b.el.classList.remove("wobble"); void b.el.offsetWidth; b.el.classList.add("wobble","out");
    softBoop();
    if(ruled.has(b.d)) return;          // tapping an already-dimmed bubble doesn't cost another miss
    ruled.add(b.d); s.strikes++; buzz(60); renderBoard();
    // solo: keep trying until the 3rd miss. battle/teams: a miss ends the turn.
    if(mode !== "solo" || s.strikes >= MAXMISS){ solved = true; reveal(false); }
  }
}

function popAt(b){
  const cx = b.x + b.size/2, cy = b.y + b.size/2;
  for(let i=0;i<12;i++){
    const s = document.createElement("div"); s.className="spark";
    s.style.background = COLORS[(b.ci+i)%COLORS.length];
    s.style.left = cx+"px"; s.style.top = cy+"px"; field.appendChild(s);
    const a = i/12*6.28, d = 50+Math.random()*50;
    s.animate([{transform:"translate(-50%,-50%) scale(1)",opacity:1},{transform:`translate(${Math.cos(a)*d-5}px,${Math.sin(a)*d-5}px) scale(.2)`,opacity:0}],{duration:500,easing:"ease-out"}).onfinish=()=>s.remove();
  }
  b.el.animate([{transform:b.el.style.transform+" scale(1)",opacity:1},{transform:b.el.style.transform+" scale(1.4)",opacity:0}],{duration:180}).onfinish=()=>b.el.remove();
  bubbles = bubbles.filter(x=>x!==b);
}

/* show the word and its meaning, then move the game along */
function reveal(ok){
  const g = game;
  if(ok){ winSound(); buzz([20,40,20]); }
  const c = $("cheer");
  c.classList.toggle("miss", !ok);
  c.querySelector(".w").textContent = (ok ? "" : "✖ ") + word;
  c.querySelector(".d").textContent = def;
  c.classList.add("show");
  Speech.say(word.toLowerCase() + ". " + def + ".", {rate:.9});
  bubbles.slice().forEach((b,i)=>setTimeout(()=>{ if(g===game && bubbles.includes(b)){ popAt(b); if(ok) tone(600+i*60,.1,"sine",.12,1.5);} }, 150+i*90));
  setTimeout(()=>{ if(g!==game || !running) return; c.classList.remove("show"); advance(); }, 3400);
}

function advance(){
  const s = sides[turn];
  if(s.strikes >= MAXMISS) s.out = true;
  if(mode === "solo") return s.out ? endGame(null) : newWord();
  const alive = sides.filter(x=>!x.out);
  if(s.score >= TARGET) return endGame(s);
  if(alive.length <= 1) return endGame(alive[0] || null);
  if(s.members) s.mi = (s.mi+1) % s.members.length;
  do { turn = (turn+1) % sides.length; } while(sides[turn].out);
  renderBoard(); showTurn();
}

/* ---------- players, turns, game over ---------- */
function who(){ const s = sides[turn]; return s.members ? s.members[s.mi] : s.name; }

function renderBoard(){
  $("board").innerHTML = sides.map((s,i)=>
    `<div class="chip${mode!=="solo" && i===turn ? " on":""}${s.out?" dead":""}" style="--c:${s.color}">` +
    (mode==="solo" ? "⭐" : `<i></i>${s.short}`) + ` <b>${s.score}</b>` +
    `<span class="ss">${[0,1,2].map(k=>`<span class="s${k<s.strikes?" x":""}"></span>`).join("")}</span></div>`
  ).join("") + (mode==="solo" ? `<div class="chip">Best ${best}</div>` : "");
}

function clearField(){ bubbles.forEach(b=>b.el.remove()); bubbles = []; }

function showTurn(){
  solved = true; clearField();
  $("word").innerHTML = "&nbsp;"; $("ask").textContent = "";
  const s = sides[turn], t = $("turn");
  t.querySelector(".who").textContent = who();
  t.querySelector(".who").style.color = s.color;
  t.querySelector(".sub").textContent = (s.members ? s.name + " · " : "") + "your turn. Take the phone.";
  t.classList.add("show");
}

function startGame(l){
  game++; lvl = l; word = ""; turn = 0;
  const mk = o => Object.assign({score:0, strikes:0, out:false}, o);
  if(mode === "solo") sides = [mk({name:"You", short:"", color:PCOL[0]})];
  else if(mode === "battle") sides = Array.from({length:nPlayers}, (_,i)=>mk({name:"Player "+(i+1), short:"P"+(i+1), color:PCOL[i]}));
  else sides = [mk({name:"Red Team", short:"Red", color:"#ff7b7b", members:["Player 1","Player 3"], mi:0}),
                mk({name:"Blue Team", short:"Blue", color:PCOL[1], members:["Player 2","Player 4"], mi:0})];
  try { best = +localStorage.getItem("wpd_best_"+lvl) || 0; } catch(e){ best = 0; }
  $("overlay").classList.add("hide"); $("end").classList.remove("show"); $("cheer").classList.remove("show");
  $("levelPill").textContent = LEVELS[lvl];
  running = true; renderBoard();
  if(mode === "solo") newWord(); else showTurn();
}

function endGame(winner){
  running = false; solved = true; game++; clearField();
  $("word").innerHTML = "&nbsp;"; $("ask").textContent = "";
  if(mode === "solo"){
    const n = sides[0].score, isBest = n > best;
    if(isBest){ best = n; try{ localStorage.setItem("wpd_best_"+lvl, best); }catch(e){} }
    $("endTitle").textContent = "Game over";
    $("endText").textContent = `3 misses. You got ${n} right on ${LEVELS[lvl]}.` + (isBest ? " New best!" : ` Best: ${best}.`);
    $("endList").innerHTML = "";
  } else {
    $("endTitle").textContent = winner ? `🏆 ${winner.name} wins!` : "Everyone is out!";
    $("endText").textContent = !winner ? "Nobody made it." : winner.score >= TARGET ? `First to ${TARGET} on ${LEVELS[lvl]}.` : `Last one standing on ${LEVELS[lvl]}.`;
    $("endList").innerHTML = sides.slice().sort((a,b)=>b.score-a.score).map(s=>
      `<div><span style="color:${s.color};font-weight:800">${s.name}</span><span>${s.score} right · ${s.strikes} missed</span></div>`).join("");
    if(winner) winSound();
  }
  $("end").classList.add("show");
}

/* ---------- loop ---------- */
function loop(t){
  const dt = Math.min(.05, (t-last)/1000 || 0); last = t;
  if(running && !solved){
    const W = field.clientWidth;
    spawnT -= dt;
    if(spawnT<=0){ spawn(); spawnT = (opt.calm?2.2:1.4) + Math.random()*.6; }
    for(const b of bubbles.slice()){
      b.y -= b.vy*dt; b.ph += dt*1.1;
      b.x = Math.max(0, Math.min(W-b.size, b.bx + Math.sin(b.ph)*b.sway));
      b.colorT -= dt;
      if(b.colorT<=0){ b.ci = (b.ci+1)%COLORS.length; b.el.style.backgroundColor = COLORS[b.ci]; b.colorT = 1.5+Math.random(); }
      b.el.style.transform = `translate(${b.x}px,${b.y}px)`;
      if(b.y < -b.size-10){ b.el.remove(); bubbles = bubbles.filter(x=>x!==b); }
    }
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
window.addEventListener("resize", ()=>{ if(word) fitWord(); });

/* ---------- menu ---------- */
document.querySelectorAll("[data-lvl]").forEach(btn=>btn.addEventListener("click",()=>{
  audio(); Speech.unlock(); startGame(+btn.dataset.lvl);
}));
function setMode(m){
  mode = m;
  document.querySelectorAll("#modeSeg button").forEach(b=>b.classList.toggle("on", b.dataset.mode===m));
  $("nSeg").hidden = m !== "battle";
  $("modeNote").textContent = NOTES[m];
}
document.querySelectorAll("#modeSeg button").forEach(b=>b.onclick = ()=>setMode(b.dataset.mode));
document.querySelectorAll("#nSeg button").forEach(b=>b.onclick = ()=>{
  nPlayers = +b.dataset.n;
  document.querySelectorAll("#nSeg button").forEach(x=>x.classList.toggle("on", x===b));
});
setMode("solo");

/* logo: the name itself, each letter in the bubble colors, slowly changing like the bubbles do */
(() => {
  const LOGO = ["#ff6b9d","#ffa94d","#ffd43b","#69db7c","#4dabf7","#f783ac","#38d9a9","#ff8787","#74c0fc"];
  const mk = t => [...t].map(ch => ch===" " ? " " : `<span>${ch}</span>`).join("");
  $("logo").innerHTML = mk("Word Pop") + "<small>" + mk("Definition") + "</small>";
  const letters = [...$("logo").querySelectorAll("span")];
  let shift = 0;
  const paint = () => letters.forEach((el,i) => el.style.color = LOGO[(i + shift) % LOGO.length]);
  paint(); setInterval(() => { shift++; paint(); }, 1800);
})();
function toMenu(){ Speech.stop(); running = false; solved = true; game++; clearField();
  $("cheer").classList.remove("show"); $("turn").classList.remove("show"); $("end").classList.remove("show"); $("overlay").classList.remove("hide"); }
$("menuBtn").onclick = toMenu;
$("endMenuBtn").onclick = toMenu;
$("againBtn").onclick = ()=>{ audio(); Speech.unlock(); startGame(lvl); };
$("turn").addEventListener("pointerdown", e=>{ e.preventDefault(); audio(); Speech.unlock(); if(running) newWord(); });
$("sayBtn").onclick = ()=>{ audio(); Speech.unlock(); if(word && !solved) sayWord(); };
[["tSound","sound"],["tCalm","calm"]].forEach(([id,k])=>{
  $(id).onclick = ()=>{ opt[k]=!opt[k]; $(id).classList.toggle("on", opt[k]); };
});

/* offline support when installed from the web (not used inside the Android app) */
try {
  if ("serviceWorker" in navigator && location.protocol === "https:" && location.hostname !== "localhost") {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
  }
} catch(e) {}
